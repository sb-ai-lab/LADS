llm:
  provider: openai
  model_name: gpt-4.5
  base_url: # Add your OpenAI-compatible endpoint (leave blank for default api.openai.com)

langfuse:
  host:   # Optional: Add Langfuse host for tracing
  user:   # Optional: Add user identifier

general:
  max_improvements: 5
  code_generation_config: 'local'   # 'local' or 'e2b'
  recursion_limit: 50
  max_code_execution_time: 600      # seconds

fedot:
  provider: openai
  model_name: gpt-4.5
  base_url: # Add url
  fix_tries: 3
  templates:
    code: "skeleton-simple.py"
    train: "fedot_train.py"
    evaluate: "fedot_evaluate.py"
    predict: "fedot_predict.py"
  predictor_init_kwargs:
    timeout: 1.0
