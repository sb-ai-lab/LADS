[project]
name = "lads"
version = "0.1.0"
description = "LLM-powered AutoDS tabular agent — AutoGluon + LLM code generation"
requires-python = ">=3.10"

dependencies = [
    # LangChain / LangGraph
    "langchain==0.3.23",
    "langchain-core==0.3.51",
    "langchain-community==0.3.21",
    "langchain-openai==0.3.9",
    "langchain-text-splitters==0.3.8",
    "langgraph==0.3.18",

    # LLM providers
    "openai==1.88.0",
    "litellm==1.73.0",

    # Observability
    "langfuse==2.60.0",

    # UI
    "streamlit==1.44.1",
    "colorlog==6.9.0",

    # Config & secrets
    "pydantic==2.10.6",
    "pydantic-settings==2.8.1",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",

    # Data & ML
    "pandas==2.2.3",
    "numpy==1.26.2",
    "scikit-learn==1.5.2",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "xgboost==2.1.4",
    "lightgbm==4.6.0",
    "catboost==1.2.8",

    # File format support
    "openpyxl==3.1.5",
    "pyarrow==19.0.1",
]

[project.optional-dependencies]
# pip install -e ".[e2b]"     → sandboxed remote code execution
e2b = [
    "e2b==1.2.0",
    "e2b-code-interpreter==1.1.1",
]
# pip install -e ".[autogluon]"
autogluon = ["autogluon.tabular"]
# pip install -e ".[flaml]"   → future FLAML path
flaml = ["flaml"]
# pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
# uv sync                         → install core deps
# uv sync --extra e2b             → + E2B sandbox
# uv sync --extra autogluon       → + AutoGluon
# uv run streamlit run app.py     → launch app

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"
